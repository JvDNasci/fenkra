[workspace]
resolver = "2"
members = [
    "crates/fenkra-core",
    "crates/fenkra-malha",
    "crates/fenkra-kernel",
    "crates/fenkra-dxf",
    "crates/fenkra-conversor",
    "crates/fenkra-cli",
    "crates/fenkra-mcp",
    "crates/fenkra-solidos",
    "crates/fenkra-project",
    "crates/fenkra-montagem",
    "crates/fenkra-desenho",
    "crates/fenkra-tolerancias",
    "crates/fenkra-app",
]

[workspace.package]
version = "0.1.0-alpha.29"
edition = "2021"
license = "LGPL-2.1-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
glam = { version = "0.34", features = ["serde", "bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
