[workspace]
resolver = "2"
members = [
    "crates/fenkra-core",
    "crates/fenkra-kernel",
    "crates/fenkra-solidos",
    "crates/fenkra-project",
    "crates/fenkra-montagem",
    "crates/fenkra-desenho",
    "crates/fenkra-app",
]

[workspace.package]
version = "0.1.0-alpha.27"
edition = "2021"
license = "LGPL-2.1-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
glam = { version = "0.34", features = ["serde", "bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
