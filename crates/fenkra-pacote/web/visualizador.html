<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visualizador Fenkra</title>
<style>
/* Cores do tema: as paletas Escuro e Claro do Fenkra. Nenhuma cor fora desta lista. */
:root{
  --fundo:#1b1d21; --janela:#202227; --campo:#0e0f12; --texto:#e1e4ea; --suave:#9aa3b2;
  --destaque:#468ce6; --linha:#33363d; --faixa:#282b32; --erro:#e5604f; --ok:#52b788;
  --vp-topo:#4a5464; --vp-base:#1a1d22; --aresta:#0d0f12; --papel:#23262d; --tinta:#e1e4ea;
  --peca:#b2b4e2; --sombra:rgba(0,0,0,.45); --raio:6px;
}
:root[data-tema="claro"]{
  --fundo:#eef0f3; --janela:#f8f9fb; --campo:#ffffff; --texto:#181c22; --suave:#5b6573;
  --destaque:#1e6edc; --linha:#cfd5de; --faixa:#e4e7ec; --erro:#c0392b; --ok:#1f8a5b;
  --vp-topo:#d6dee8; --vp-base:#9eaaba; --aresta:#2a3140; --papel:#ffffff; --tinta:#181c22;
  --peca:#767aaa; --sombra:rgba(30,40,60,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--fundo);color:var(--texto);
  font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{background:var(--faixa);border:1px solid var(--linha);border-radius:var(--raio);padding:0 10px;min-height:40px;min-width:40px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--destaque)}
button[aria-pressed="true"],button.ativo{background:var(--destaque);border-color:var(--destaque);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--destaque);outline-offset:1px}
input[type=search],input[type=text],select{background:var(--campo);border:1px solid var(--linha);border-radius:var(--raio);padding:0 10px;min-height:40px;width:100%;min-width:0}
#app{display:grid;grid-template-rows:auto 1fr;height:100%;height:100dvh;width:100%}
header{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--janela);border-bottom:1px solid var(--linha);min-width:0;flex-wrap:wrap}
header h1{font-size:15px;margin:0 4px 0 2px;font-weight:600;flex:1 1 90px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;gap:0}
.seg button{border-radius:0}
.seg button:first-child{border-radius:var(--raio) 0 0 var(--raio)}
.seg button:last-child{border-radius:0 var(--raio) var(--raio) 0}
main{display:grid;grid-template-columns:minmax(0,1fr);min-height:0;position:relative}
main.com-painel{grid-template-columns:340px minmax(0,1fr)}
#painel{display:none;flex-direction:column;background:var(--janela);border-right:1px solid var(--linha);min-height:0;min-width:0}
main.com-painel #painel{display:flex}
#abas{display:flex;gap:2px;padding:6px;scrollbar-width:none;border-bottom:1px solid var(--linha);overflow-x:auto;flex:none}
#abas button{flex:1 1 auto;padding:0 5px;min-height:36px;font-size:13px}
#conteudo{flex:1;overflow:auto;padding:8px;min-height:0;-webkit-overflow-scrolling:touch}
#palco{position:relative;min-width:0;min-height:0;overflow:hidden;background:linear-gradient(var(--vp-topo),var(--vp-base))}
#cena3d,#folha{position:absolute;inset:0}
#cena3d canvas{display:block;width:100%;height:100%;touch-action:none}
#folha{background:var(--fundo);display:none;touch-action:none}
#folha svg{width:100%;height:100%;display:block;touch-action:none;user-select:none}
#barra button{min-width:0}
#barra{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:4px;justify-content:center;
  padding:4px;background:var(--janela);border:1px solid var(--linha);border-radius:10px;box-shadow:0 4px 16px var(--sombra);max-width:calc(100% - 16px)}
#flutuantes{position:absolute;left:8px;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
#flutuantes>*{pointer-events:auto}
#corte{display:none;gap:6px;align-items:center;padding:6px;background:var(--janela);border:1px solid var(--linha);border-radius:10px;box-shadow:0 4px 16px var(--sombra);flex-wrap:wrap;max-width:100%;width:460px}
#corte input[type=range]{flex:1 1 140px;min-width:100px;height:32px}
#medida{max-width:100%;display:none;padding:6px 10px;background:var(--janela);border:1px solid var(--destaque);border-radius:var(--raio);box-shadow:0 2px 10px var(--sombra);font-variant-numeric:tabular-nums}
#aviso{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--fundo)}
#aviso.on{display:flex}
#aviso .caixa{max-width:420px}
#aviso h2{margin:0 0 8px;font-size:18px}
#aviso p{color:var(--suave);margin:6px 0}
#soltar{outline:2px dashed var(--destaque);outline-offset:-8px}
.fila{display:flex;gap:6px;margin:0 0 8px}
ul.arv{list-style:none;margin:0;padding:0}
ul.arv ul{list-style:none;margin:0;padding-left:16px;border-left:1px solid var(--linha)}
.lin{display:flex;align-items:center;gap:4px;min-height:38px;border-radius:var(--raio);padding-right:4px}
.lin:hover{background:var(--faixa)}
.lin.sel{background:color-mix(in srgb,var(--destaque) 28%,transparent);outline:1px solid var(--destaque)}
.lin .nome{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:8px 2px}
.lin .nome small{color:var(--suave);margin-left:6px}
.lin .seta{width:28px;min-width:28px;min-height:32px;padding:0;border:0;background:none}
.lin input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--destaque)}
.lin .vazio{width:28px;flex:none}
table.dados{width:100%;border-collapse:collapse}
table.dados td,table.dados th{padding:6px 4px;border-bottom:1px solid var(--linha);text-align:left;vertical-align:top;overflow-wrap:anywhere}
table.dados th{color:var(--suave);font-weight:500;width:42%}
.item{display:block;width:100%;text-align:left;margin:0 0 4px;padding:8px 10px;min-height:44px;height:auto}
.item small{display:block;color:var(--suave)}
.item[aria-pressed="true"] small{color:#fff}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--suave);margin:12px 0 6px}
.nada{color:var(--suave);padding:8px 2px}
.rotulo3d{position:absolute;pointer-events:none;transform:translate(-50%,-120%);background:var(--janela);border:1px solid var(--destaque);border-radius:4px;padding:1px 6px;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
#tip{position:absolute;pointer-events:none;display:none;background:var(--janela);border:1px solid var(--linha);border-radius:4px;padding:2px 6px;font-size:12px;z-index:3}
@media (max-width:760px){
  main.com-painel{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,46%)}
  main.com-painel #palco{grid-row:1}
  main.com-painel #painel{grid-row:2;border-right:0;border-top:1px solid var(--linha);box-shadow:0 -6px 20px var(--sombra);border-radius:12px 12px 0 0;z-index:2}
  header h1{flex-basis:100%;order:-1}
  #barra button{padding:0 7px;min-height:38px;font-size:13px}
  #barra{gap:3px;bottom:6px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="titulo">Visualizador Fenkra</h1>
    <div class="seg" id="modos" role="tablist" hidden>
      <button id="m3d" role="tab" aria-pressed="true" data-t="3D">3D</button>
      <button id="mfolha" role="tab" aria-pressed="false" data-t="folhas">Folhas</button>
    </div>
    <button id="bpainel" aria-pressed="true" data-t="painel">Painel</button>
    <button id="babrir" data-t="abrir">Abrir</button>
    <button id="btema" data-t="tema">Tema</button>
    <input id="arquivo" type="file" accept=".fkv,application/zip" hidden>
  </header>
  <main id="main" class="com-painel">
    <aside id="painel">
      <div id="abas" role="tablist"></div>
      <div id="conteudo"></div>
    </aside>
    <section id="palco">
      <div id="cena3d"></div>
      <div id="folha"></div>
      <div id="barra" role="toolbar"></div>
      <div id="flutuantes"><div id="corte"></div><div id="medida" role="status" aria-live="polite"></div></div>
      <div id="aviso" class="on"><div class="caixa"><h2 data-t="vazio_t">Abra um pacote .fkv</h2><p data-t="vazio_p">Escolha o arquivo ou arraste-o para cá. Nada sai do seu aparelho.</p><button id="babrir2" data-t="abrir">Abrir</button></div></div>
    </section>
  </main>
</div>
<!-- O pacote embutido: base64 de um .fkv (vazio quando a página serve de componente). -->
<script id="fkv-dados" type="application/octet-stream">/*@PACOTE@*/</script>
<script>/*@THREE@*/</script>
<script>
"use strict";
/* ========================================================================================
   Visualizador Fenkra (B338). Lê o pacote .fkv (ver docs/formatos/pacote-visualizacao.md).
   Como componente: FenkraVisualizador.abrir(fonte) com fonte = URL, ArrayBuffer, Uint8Array
   ou File; ?src=URL; ou postMessage({fkv: URL | ArrayBuffer}).
   ======================================================================================== */
const TX = {
 pt:{ "3D":"3D", folhas:"Folhas", painel:"Painel", abrir:"Abrir", tema:"Tema",
  vazio_t:"Abra um pacote .fkv", vazio_p:"Escolha o arquivo ou arraste-o para cá. Nada sai do seu aparelho.",
  arvore:"Árvore", dados:"Dados", pmi:"PMI", vistas:"Vistas", estados:"Estados", lista:"Lista",
  buscar:"Buscar peça, código ou material", ajustar:"Ajustar", isolar:"Isolar", tudo:"Tudo", cortar:"Cortar", medir:"Medir", orto:"Orto", persp:"Persp.",
  sem_sel:"Toque numa peça para ver os dados.", nome:"Nome", pn:"Código", descricao:"Descrição", material:"Material", tipo_de_peca:"Tipo",
  massa_kg:"Massa (kg)", volume_mm3:"Volume (mm³)", area_mm2:"Área (mm²)", dimensoes_mm:"Dimensões (mm)", centro_de_massa_mm:"Centro de massa (mm)",
  caixa_mm:"Caixa (mm)", personalizados:"Personalizados", titulo:"Título", revisao:"Revisão", projecao:"Projeção",
  sem_pmi:"Este pacote não tem anotações 3D.", sem_vistas:"Sem capturas nem vistas salvas.", sem_estados:"Sem estados de exibição.", sem_lista:"Sem lista.",
  todas_pmi:"Mostrar todas as anotações", restaurar:"Restaurar", alvo:"Alvo", face:"Face", triangulos:"Triângulos", pecas:"Peças", instancias:"Instâncias",
  eixo:"Eixo", inverter:"Inverter", ponto1:"Toque no primeiro ponto.", ponto2:"Toque no segundo ponto.", dist:"Distância", exato:"exato", aprox:"aproximado",
  diam:"Diâmetro", erro:"Não foi possível abrir o pacote", sem_nav:"Este navegador não descomprime o pacote (falta DecompressionStream). Use uma versão recente do Chromium, Firefox ou Safari.",
  folha:"Folha", ajuste:"Ajustar à tela", papel:"Papel", escala:"Escala", mm_papel:"no papel", mm_modelo:"no modelo", resultados:"Resultados", nenhum:"Nada encontrado.",
  item:"Item", qtd:"Qtd", arquivo:"Arquivo", sem_corpo:"sem corpo", decimado:"malha simplificada", mostrar:"Mostrar", ocultar:"Ocultar", sel_alvo:"Alvo da anotação", cena_t:"Cena",
  limpar:"Limpar", tipo:"Tipo", valor:"Valor" },
 en:{ "3D":"3D", folhas:"Sheets", painel:"Panel", abrir:"Open", tema:"Theme",
  vazio_t:"Open a .fkv package", vazio_p:"Choose the file or drop it here. Nothing leaves your device.",
  arvore:"Tree", dados:"Data", pmi:"PMI", vistas:"Views", estados:"States", lista:"List",
  buscar:"Search part, code or material", ajustar:"Fit", isolar:"Isolate", tudo:"All", cortar:"Section", medir:"Measure", orto:"Ortho", persp:"Persp.",
  sem_sel:"Tap a part to see its data.", nome:"Name", pn:"Part no.", descricao:"Description", material:"Material", tipo_de_peca:"Type",
  massa_kg:"Mass (kg)", volume_mm3:"Volume (mm³)", area_mm2:"Area (mm²)", dimensoes_mm:"Size (mm)", centro_de_massa_mm:"Center of mass (mm)",
  caixa_mm:"Box (mm)", personalizados:"Custom", titulo:"Title", revisao:"Revision", projecao:"Projection",
  sem_pmi:"This package has no 3D annotations.", sem_vistas:"No captures or saved views.", sem_estados:"No display states.", sem_lista:"No list.",
  todas_pmi:"Show all annotations", restaurar:"Restore", alvo:"Target", face:"Face", triangulos:"Triangles", pecas:"Parts", instancias:"Instances",
  eixo:"Axis", inverter:"Flip", ponto1:"Tap the first point.", ponto2:"Tap the second point.", dist:"Distance", exato:"exact", aprox:"approximate",
  diam:"Diameter", erro:"Could not open the package", sem_nav:"This browser cannot decompress the package (no DecompressionStream). Use a recent Chromium, Firefox or Safari.",
  folha:"Sheet", ajuste:"Fit to screen", papel:"Paper", escala:"Scale", mm_papel:"on paper", mm_modelo:"on model", resultados:"Results", nenhum:"Nothing found.",
  item:"Item", qtd:"Qty", arquivo:"File", sem_corpo:"no body", decimado:"simplified mesh", mostrar:"Show", ocultar:"Hide", sel_alvo:"Annotation target", cena_t:"Scene",
  limpar:"Clear", tipo:"Type", valor:"Value" }
};
const IDIOMA = (navigator.language||"pt").toLowerCase().startsWith("en") ? "en" : "pt";
const T = k => (TX[IDIOMA][k] ?? TX.pt[k] ?? k);
const $ = s => document.querySelector(s);
const el = (tag, attrs, ...filhos) => { const e = document.createElement(tag); for (const [k,v] of Object.entries(attrs||{})) { if (k==="class") e.className=v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v===true) e.setAttribute(k,""); else if (v!==false && v!=null) e.setAttribute(k,v);} for (const f of filhos.flat()) if (f!=null) e.append(f.nodeType?f:document.createTextNode(f)); return e; };
const num = (v, d=3) => { if (typeof v!=="number") return String(v); const s = v.toFixed(d).replace(/\.?0+$/,""); return (IDIOMA==="pt"? s.replace(".",",") : s); };

/* ---------------- tema ---------------- */
function corCSS(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function aplicarTema(t){
  document.documentElement.dataset.tema = t;
  try{ localStorage.setItem("fkv-tema", t); }catch(e){}
  if (V3.pronto) V3.tema();
  if (Folha.svg) Folha.desenhar();
}
(function(){
  let t=null; try{ t=localStorage.getItem("fkv-tema"); }catch(e){}
  if(!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "claro":"escuro";
  document.documentElement.dataset.tema = t;
})();

/* ---------------- zip e glb ---------------- */
async function inflar(dados){
  if (typeof DecompressionStream==="undefined") throw new Error(T("sem_nav"));
  const s = new Blob([dados]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function lerZip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let e = -1;
  for (let i = u8.length-22; i >= Math.max(0,u8.length-65558); i--) if (dv.getUint32(i,true)===0x06054b50){ e=i; break; }
  if (e<0) throw new Error("zip");
  const n = dv.getUint16(e+10,true); let p = dv.getUint32(e+16,true);
  const dec = new TextDecoder(), mapa = new Map();
  for (let i=0;i<n;i++){
    if (dv.getUint32(p,true)!==0x02014b50) throw new Error("zip");
    const metodo=dv.getUint16(p+10,true), cs=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lo=dv.getUint32(p+42,true);
    const nome = dec.decode(u8.subarray(p+46,p+46+nl));
    const ini = lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);
    mapa.set(nome,{metodo,ini,cs});
    p += 46+nl+el+cl;
  }
  return { nomes:[...mapa.keys()], async ler(nome){
    const m = mapa.get(nome); if(!m) return null;
    const bruto = u8.subarray(m.ini,m.ini+m.cs);
    return m.metodo===0 ? bruto : inflar(bruto);
  }};
}
function lerGLB(u8){
  const dv = new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  if (dv.getUint32(0,true)!==0x46546c67) throw new Error("glb");
  const lj = dv.getUint32(12,true);
  const json = JSON.parse(new TextDecoder().decode(u8.subarray(20,20+lj)));
  const bin = 20+lj+8;
  return { json, bin, buf: u8.buffer.slice(u8.byteOffset, u8.byteOffset+u8.byteLength) };
}

/* ---------------- estado do pacote ---------------- */
const P = { zip:null, m:null, glb:null, entradas:new Map(), raizes:[], sel:null, isolado:null, base:null,
  pmiFiltro:null, pmiSel:null, capAtiva:null, estadoAtivo:null, offsets:new Map(), cores:new Map() };

/* ---------------- 3D ---------------- */
const V3 = {
  pronto:false, cam:{alvo:[0,0,0],yaw:-0.785,pitch:0.6,dist:300,orto:false}, raio:100,
  precisa:true, corte:{on:false,eixo:2,valor:0,inv:false,min:-1,max:1}, medindo:false, pts:[], cenaRaiz:null, geoms:new Map(),
  init(){
    if (this.pronto) return;
    const cont = $("#cena3d");
    this.r = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
    this.r.setPixelRatio(Math.min(devicePixelRatio||1,2));
    this.r.localClippingEnabled = true;
    this.r.setClearColor(0x000000,0);
    cont.append(this.r.domElement);
    this.s = new THREE.Scene();
    this.persp = new THREE.PerspectiveCamera(34.4,1,1,1000);
    this.ortoCam = new THREE.OrthographicCamera(-1,1,1,-1,0.1,1000);
    this.c = this.persp;
    this.s.add(new THREE.HemisphereLight(0xffffff,0x667080,0.55));
    this.luz = new THREE.DirectionalLight(0xffffff,0.55); this.s.add(this.luz); this.s.add(this.luz.target);
    this.grupo = new THREE.Group(); this.s.add(this.grupo);
    this.anot = new THREE.Group(); this.s.add(this.anot);
    this.mark = new THREE.Group(); this.s.add(this.mark);
    this.plano = new THREE.Plane(new THREE.Vector3(0,0,1),0);
    this.ray = new THREE.Raycaster();
    new ResizeObserver(()=>this.tamanho()).observe(cont);
    this.controles();
    this.pronto = true;
    this.tamanho();
    const laco = ()=>{ requestAnimationFrame(laco); if (this.anim) this.anim(); if (this.precisa){ this.precisa=false; this.desenhar(); } };
    laco();
  },
  tamanho(){
    const cont=$("#cena3d"), w=Math.max(1,cont.clientWidth), h=Math.max(1,cont.clientHeight);
    this.r.setSize(w,h,false); this.w=w; this.h=h; this.cameraAtualizar(); this.precisa=true;
  },
  tema(){
    for (const e of P.entradas.values()) if (e.malhaObj) this.pintar(e);
    this.anotar(); this.precisa=true;
  },
  /* A peça precisa ficar sempre distinta do fundo: clareia ou escurece a cor até haver diferença. */
  corVisivel(rgb){
    const lum = c => (0.2126*c[0]+0.7152*c[1]+0.0722*c[2])/255;
    const fundo = [corCSS("--vp-topo"),corCSS("--vp-base")].map(h=>{const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];});
    const lf = (lum(fundo[0])+lum(fundo[1]))/2, claro = lf>0.5;
    let c = rgb.slice();
    for (let i=0;i<12 && Math.abs(lum(c)-lf)<0.28;i++) c = c.map(v=> claro ? v*0.82 : Math.min(255,v*1.18+8));
    return new THREE.Color(c[0]/255,c[1]/255,c[2]/255);
  },
  pintar(e){
    const cor = P.cores.get(e.id) || e.cor || [178,180,226];
    const m = e.malhaObj.material; m.color.copy(this.corVisivel(cor));
    if (e.malhaObj.userData.arestas) e.malhaObj.userData.arestas.material.color.set(corCSS("--aresta"));
    const sel = P.sel && (P.sel===e.id || e.id.startsWith(P.sel+"/"));
    m.emissive.set(sel ? corCSS("--destaque") : "#000000"); m.emissiveIntensity = sel ? 0.22 : 1;
  },
  construir(){
    const g = P.glb, J = g.json;
    const cache = new Map();
    const geometria = i => {
      if (cache.has(i)) return cache.get(i);
      const prim = J.meshes[i].primitives[0], geo = new THREE.BufferGeometry();
      const acc = k => {
        const a = J.accessors[k], v = J.bufferViews[a.bufferView];
        const T_ = {5126:Float32Array,5120:Int8Array,5123:Uint16Array,5125:Uint32Array}[a.componentType];
        const nc = {SCALAR:1,VEC3:3}[a.type], off = g.bin+(v.byteOffset||0)+(a.byteOffset||0);
        return { a, T_, nc, off, stride: v.byteStride||0 };
      };
      const pos = acc(prim.attributes.POSITION);
      geo.setAttribute("position", new THREE.BufferAttribute(new pos.T_(g.buf,pos.off,pos.a.count*3),3));
      if (prim.attributes.NORMAL!=null){
        const n = acc(prim.attributes.NORMAL);
        const ib = new THREE.InterleavedBuffer(new Int8Array(g.buf,n.off,n.a.count*(n.stride||3)),n.stride||3);
        geo.setAttribute("normal", new THREE.InterleavedBufferAttribute(ib,3,0,true));
      } else { geo.userData.semNormal=true; }
      const ix = acc(prim.indices);
      geo.setIndex(new THREE.BufferAttribute(new ix.T_(g.buf,ix.off,ix.a.count),1));
      geo.computeBoundingBox(); geo.computeBoundingSphere();
      cache.set(i,geo); return geo;
    };
    const objs = [];
    const nos = J.nodes.map((n,i)=>{

  perto(h, x, y, px){

/* mapa de faces: início dos triângulos de cada face (em índices) */
function faceDe(e, tri){
  const f = e.malha && e.malha.faces; if (!f||tri==null) return null;
  const k = tri*3; let lo=0, hi=f.length-1;
  while (lo<hi){ const mid=(lo+hi+1)>>1; if (f[mid]<=k) lo=mid; else hi=mid-1; }
  const t = e.malha.tipos_de_face && e.malha.tipos_de_face[lo];
  return t ? {n:lo+1, tipo:["plana","cilíndrica","cônica","esférica","toroidal","livre"][t[0]]||"?", area:t[1]} : null;
}

/* ---------------- árvore, seleção e visibilidade ---------------- */
function indexar(m){
  P.entradas.clear(); P.raizes=[];
  m.arvore.forEach(a=>{ const e = Object.assign({filhos:[],vis:a.visivel!==false,aberto:true},a); e.malha = a.malha ? m.malhas.find(x=>x.id===a.malha) : null; P.entradas.set(a.id,e); });
  for (const e of P.entradas.values()){ if (e.pai && P.entradas.has(e.pai)) P.entradas.get(e.pai).filhos.push(e); else P.raizes.push(e); }
  P.base = new Map([...P.entradas].map(([k,e])=>[k,e.vis]));
}
function aplicarVisibilidade(){
  const iso = P.isolado; let ok=null;
  if (iso){ ok = new Set(); const e=P.entradas.get(iso); const desc = x=>{ok.add(x.id);x.filhos.forEach(desc);}; if(e){ desc(e); for (let p=e;p;p=P.entradas.get(p.pai)) ok.add(p.id);} }
  for (const e of P.entradas.values()) if (e.obj) e.obj.visible = e.vis && (!ok || ok.has(e.id));
  V3.precisa = true; $("#isolar") && $("#isolar").setAttribute("aria-pressed", String(!!iso));
  refrescarArvore();
}
function selecionar(id, extra){
  P.sel = id; P.selExtra = extra||null;
  for (const e of P.entradas.values()) if (e.malhaObj) V3.pintar(e);
  V3.precisa = true; refrescarArvore();
  if (id) mostrarAba("dados", true); else refrescarDados();
  refrescarDados();
}
const texto_busca = e => [e.nome, e.atributos && e.atributos.pn, e.atributos && e.atributos.material, e.atributos && e.atributos.descricao].filter(Boolean).join(" ").toLowerCase();
let consulta = "";
function casa(e){ return !consulta || texto_busca(e).includes(consulta) || e.filhos.some(casa); }
function linhaArvore(e){
  if (!casa(e)) return null;
  // peça de um corpo só: o corpo não aparece, a peça já o representa
  const filhos = (e.tipo==="peca" && e.filhos.length===1) ? [] : e.filhos;
  const li = el("li");
  const seta = filhos.length ? el("button",{class:"seta","aria-label":e.aberto?"-":"+","aria-expanded":String(e.aberto),onclick:()=>{e.aberto=!e.aberto;refrescarArvore();}},e.aberto?"▾":"▸") : el("span",{class:"vazio"});
  const cx = el("input",{type:"checkbox",checked:e.vis,"aria-label":T("mostrar")+" "+e.nome,onchange:ev=>{ e.vis=ev.target.checked; if(e.tipo==="peca"&&e.filhos.length===1) e.filhos[0].vis=e.vis; aplicarVisibilidade(); }});
  const pn = e.atributos && e.atributos.pn;
  const lin = el("div",{class:"lin"+(P.sel===e.id?" sel":"")}, seta, cx,
    el("span",{class:"nome",tabindex:0,role:"button",onclick:()=>selecionar(e.id),onkeydown:ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selecionar(e.id);}}}, e.nome, pn?el("small",{},pn):null));
  li.append(lin);
  if (filhos.length && e.aberto){ const ul = el("ul"); filhos.forEach(f=>{const l=linhaArvore(f); if(l) ul.append(l);}); li.append(ul); }
  return li;
}
function refrescarArvore(){ if (P.aba!=="arvore") return; const raiz = $("#lista-arvore"); if(!raiz) return; const ul=el("ul",{class:"arv"}); P.raizes.forEach(r=>{const l=linhaArvore(r); if(l) ul.append(l);}); raiz.replaceChildren(ul);
  if (!ul.childNodes.length) raiz.append(el("div",{class:"nada"},T("nenhum"))); }

function isolarSelecionado(){
  if (P.isolado){ P.isolado=null; } else if (P.sel){ P.isolado=P.sel; } else return;
  aplicarVisibilidade(); V3.ajustar();
}
function mostrarTudo(){ P.isolado=null; for (const [k,v] of P.base) P.entradas.get(k).vis=true; aplicarVisibilidade(); V3.ajustar(); }

/* ---------------- painéis ---------------- */

const Folha = {
  ativo:false, i:0, dados:[], svg:null, vb:null, medindo:false, pts:[], papelBranco:false, achados:[],
  async abrir(i){

    d.itens.forEach((it,k)=>{
      const cor = tintaPapel && this.cor(it)==="var(--tinta)" ? tintaPapel : this.cor(it);
      if (it.t==="l"){
        let p=""; for (let j=0;j<it.p.length;j+=2) p+=f(it.p[j])+","+f(H-it.p[j+1])+" ";
        const e = it.e||0;
        partes.push(`<polyline points="${p}" fill="none" stroke="${cor}" stroke-width="${it.w||larg[e]}" stroke-linecap="round" stroke-linejoin="round"${tr[e]?` stroke-dasharray="${tr[e]}"`:""}/>`);
      } else if (it.t==="f"){
        let p=""; for (let j=0;j<it.p.length;j+=2) p+=f(it.p[j])+","+f(H-it.p[j+1])+" "; partes.push(`<polygon points="${p}" fill="${cor}"/>`);
      } else {

      }

  ajustar(){

  },
  medida(){
    const box=$("#medida"); box.style.display=this.medindo?"block":"none"; if(!this.medindo){ this.desenhar(); return; }
    const p=this.pts; if(p.length<2){ box.textContent = p.length?T("ponto2"):T("ponto1"); return; }
    const d=this.dados[this.i], dist=Math.hypot(p[1][0]-p[0][0],p[1][1]-p[0][1]);
    const dentro=(v,q)=>q[0]>=v.caixa[0]-.01&&q[0]<=v.caixa[2]+.01&&q[1]>=v.caixa[1]-.01&&q[1]<=v.caixa[3]+.01;
    const v=(d.vistas||[]).find(v=>dentro(v,p[0])&&dentro(v,p[1]));
    box.replaceChildren(el("strong",{},`${num(dist,3)} mm ${T("mm_papel")}`), v&&v.escala?el("div",{},`${num(dist/v.escala,3)} mm ${T("mm_modelo")} (${T("escala")} ${v.escala>=1?num(v.escala,3)+":1":"1:"+num(1/v.escala,3)})`):null,
      el("small",{style:"color:var(--suave)"},`ΔX ${num(p[1][0]-p[0][0])}  ΔY ${num(p[1][1]-p[0][1])}`));
    window.__ultimaMedida2d={dist,modelo:v?dist/v.escala:null};
  },
  buscar(q){
    const alvo=$("#res-folha"); this.achados=[];
    if (!alvo) return;
    alvo.replaceChildren(); const d=this.dados[this.i]; if(!P.m||!q||!P.m.folhas.length) { if(d&&this.svg) this.desenhar(); return; }
    (async()=>{
      for (let i=0;i<P.m.folhas.length;i++){ if(!this.dados[i]){ const b=await P.zip.ler(P.m.folhas[i].arquivo); this.dados[i]=JSON.parse(new TextDecoder().decode(b)); this.indexar(i);} }
      const res=[]; this.dados.forEach((fd,i)=>fd.itens.forEach((it,k)=>{ if(it.t==="x"&&it.s.toLowerCase().includes(q)) res.push({i,k,it}); }));
      alvo.replaceChildren(el("h3",{},T("resultados")+" ("+res.length+")"), ...(res.length?res.slice(0,40).map(r=>el("button",{class:"item",onclick:()=>this.ir(r)},r.it.s,el("small",{},P.m.folhas[r.i].nome))):[el("div",{class:"nada"},T("nenhum"))]));
    })();
  },
  async ir(r){
    await definirModo("folha"); if (this.i!==r.i) await this.abrir(r.i);
    this.achados=[r.k]; this.desenhar();
    const it=r.it, d=this.dados[this.i], c=$("#folha"), ar=c.clientWidth/Math.max(1,c.clientHeight), w=Math.max(it.s.length*it.h*4,d.largura*0.25), h=w/ar;
    this.vb={x:it.p[0]-w/2,y:d.altura-it.p[1]-h/2,w,h}; this.aplicarVB();
  }
};

/* ---------------- abertura do pacote ---------------- */
async function definirModo(m){
  const folha = m==="folha";
  Folha.ativo = folha;
  $("#cena3d").style.display = folha?"none":"block"; $("#folha").style.display = folha?"block":"none";
  $("#m3d").setAttribute("aria-pressed",String(!folha)); $("#mfolha").setAttribute("aria-pressed",String(folha));
  $("#corte").style.display = (!folha&&V3.corte.on)?"flex":"none";
  $("#medida").style.display = "none";
  if (folha && !Folha.svg) await Folha.abrir(Folha.i);
  montarBarra(); if (folha) { Folha.medida(); Folha.ajustar(); } else if (V3.pronto) { V3.medidaAtualizar(); V3.tamanho(); }
}
function mostrarErro(msg){
  const a=$("#aviso"); a.classList.add("on"); a.querySelector("h2").textContent=T("erro"); a.querySelector("p").textContent=msg;
}
async function carregar(fonte){
  try{
    let buf;
    if (typeof fonte==="string"){ const r = await fetch(fonte); if(!r.ok) throw new Error(fonte+": "+r.status); buf = await r.arrayBuffer(); }
    else if (fonte instanceof Blob) buf = await fonte.arrayBuffer();
    else if (fonte instanceof ArrayBuffer) buf = fonte;
    else if (ArrayBuffer.isView(fonte)) buf = fonte.buffer.slice(fonte.byteOffset,fonte.byteOffset+fonte.byteLength);
    else throw new Error("fonte");
    const zip = await lerZip(buf);
    const m = JSON.parse(new TextDecoder().decode(await zip.ler("pacote.json")));
    if (m.formato!=="fenkra-visualizacao") throw new Error("formato");
    if (m.versao>1) throw new Error("versão "+m.versao+" > 1");
    Object.assign(P,{zip,m,sel:null,isolado:null,pmiFiltro:null,pmiSel:null,capAtiva:null,estadoAtivo:null,aba:null});
    P.cores.clear(); Folha.dados=[]; Folha.svg=null; Folha.i=0; Folha.medindo=false;
    indexar(m); $("#titulo").textContent = m.nome;
    document.title = m.nome+" · "+"Fenkra";
    $("#aviso").classList.remove("on");
    const tem3d = !!m.cena, temFolha = m.folhas.length>0;
    $("#modos").hidden = !(tem3d&&temFolha);
    if (tem3d){ V3.init(); P.glb = lerGLB(await zip.ler(m.cena)); V3.construir(); aplicarVisibilidade(); V3.ajustar(false); V3.anotar(); }
    else { V3.pronto && V3.grupo.clear(); }
    montarAbas();
    mostrarAba(m.arvore.length?"arvore":"dados");
    await definirModo(tem3d?"3d":"folha");
    if (window.matchMedia("(max-width:760px)").matches) { /* painel recolhido só se o usuário pedir; começa aberto na metade de baixo */ }
    window.__fkv = {P,V3,Folha};
    return m;
  }catch(e){ console.error(e); mostrarErro(String(e.message||e)); }
}
window.FenkraVisualizador = { abrir: carregar, versao: 1, estado: ()=>P };

function ligar(){
  document.querySelectorAll("[data-t]").forEach(n=>n.textContent=T(n.dataset.t));
  document.documentElement.lang = IDIOMA==="en"?"en":"pt-BR";
  const abrir = ()=>$("#arquivo").click();
  $("#babrir").onclick = $("#babrir2").onclick = abrir;
  $("#arquivo").onchange = e=>{ if(e.target.files[0]) carregar(e.target.files[0]); e.target.value=""; };
  $("#btema").onclick = ()=>aplicarTema(document.documentElement.dataset.tema==="claro"?"escuro":"claro");
  $("#bpainel").onclick = ()=>{ const m=$("#main"); m.classList.toggle("com-painel"); $("#bpainel").setAttribute("aria-pressed",String(m.classList.contains("com-painel"))); setTimeout(()=>{V3.pronto&&V3.tamanho(); Folha.svg&&Folha.ajustar();},30); };
  $("#m3d").onclick = ()=>definirModo("3d"); $("#mfolha").onclick = ()=>definirModo("folha");
  const pal=$("#palco");
  ["dragenter","dragover"].forEach(t=>addEventListener(t,e=>{e.preventDefault();pal.id="palco";document.body.id="soltar";}));
  ["dragleave","drop"].forEach(t=>addEventListener(t,e=>{e.preventDefault();document.body.id="";}));
  addEventListener("drop",e=>{ const f=e.dataTransfer&&e.dataTransfer.files[0]; if(f) carregar(f); });
  addEventListener("message",e=>{ const d=e.data; if(d&&d.fkv) carregar(d.fkv); });
  const q = new URLSearchParams(location.search), src = q.get("src") || (location.hash.startsWith("#src=")?decodeURIComponent(location.hash.slice(5)):null);
  const emb = $("#fkv-dados").textContent.trim();
  if (emb){ const b=atob(emb), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); carregar(u); }
  else if (src) carregar(src);
  addEventListener("resize",()=>{ Folha.svg&&Folha.ativo&&0; });
}
ligar();
</script>
