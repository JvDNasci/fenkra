[package]
name = "scc-app"
description = "Aplicativo SolidCadCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "solidcadcraft"
path = "src/main.rs"

[dependencies]
scc-core = { path = "../scc-core" }
scc-kernel = { path = "../scc-kernel" }
scc-solidos = { path = "../scc-solidos" }
scc-project = { path = "../scc-project" }
eframe = { version = "0.37", features = ["wgpu"] }
glam.workspace = true
bytemuck.workspace = true
rfd = "0.17"
egui_extras = { version = "0.37", features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
