[package]
name = "fenkra-app"
description = "Aplicativo Fenkra"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"
default-run = "fenkra"

[[bin]]
name = "fenkra"
path = "src/main.rs"

[[bin]]
name = "fenkra-conv"
path = "src/bin/fenkra_conv.rs"

[dependencies]
fenkra-core = { path = "../fenkra-core" }
fenkra-kernel = { path = "../fenkra-kernel" }
fenkra-conversor = { path = "../fenkra-conversor" }
fenkra-malha = { path = "../fenkra-malha" }
fenkra-solidos = { path = "../fenkra-solidos" }
fenkra-project = { path = "../fenkra-project" }
fenkra-montagem = { path = "../fenkra-montagem" }
fenkra-desenho = { path = "../fenkra-desenho" }
fenkra-pacote = { path = "../fenkra-pacote" }
eframe = { version = "0.37", features = ["wgpu", "persistence"] }
glam.workspace = true
bytemuck.workspace = true
rfd = "0.17"
egui_extras = { version = "0.37", features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# mouse 3D pelo HID do sistema (B322): só enumeração e leitura, sem driver do fabricante
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
