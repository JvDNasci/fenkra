# cargo-deny: política de licenças do Fenkra (B151/B201). Rodar: cargo deny check licenses
# A CI roda licenses, bans e sources em cada commit (.github/workflows/ci.yml).
# Licença do projeto: LGPL-2.1-or-later (ADR 0003, ainda proposta).

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[licenses]
confidence-threshold = 0.9
# Tudo o que não estiver aqui é recusado (GPL, AGPL, desconhecidas).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "LGPL-2.1-or-later",
]

# self_cell é Apache-2.0 OR GPL-2.0-only: o cargo-deny aceita a expressão pela alternativa permitida.
# A GPL só é usada se não houver alternativa; não há exceção para GPL, AGPL nem SSPL.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Os crates do workspace não são publicados: dependência por caminho não conta como curinga.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
